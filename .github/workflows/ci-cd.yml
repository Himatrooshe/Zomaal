name: CI and production deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: zomaal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/zomaal_ci

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v6
        with:
          # Full history, not the default shallow clone — the destructive-
          # migration check below needs to diff against the previous
          # commit/base ref to find only NEWLY added migration files.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Reject destructive production migrations
        shell: bash
        run: |
          # Only scans migration files newly ADDED in this push/PR — not the
          # entire accumulated history. Once a destructive migration has
          # gone through the reviewed manual deployment procedure this gate
          # requires and is merged, it must never cause every subsequent,
          # unrelated push to fail this same check forever. Existing
          # migration files are also never expected to be edited in place
          # (Prisma's own convention), so a diff-filter=A (Added) is the
          # correct scope, not a red flag if some future migration touches
          # an old file — that would be caught by other review, not this gate.
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "::warning::No valid previous commit to diff against (first push to a new branch, or force-push) — checking every migration file as a fallback."
            new_migrations="$(find prisma/migrations -name '*.sql')"
          else
            new_migrations="$(git diff --name-only --diff-filter=A "$base" HEAD -- 'prisma/migrations/*.sql')"
          fi
          if [ -z "$new_migrations" ]; then
            exit 0
          fi
          destructive="$(grep -ERnli \
            'DROP[[:space:]]+(DATABASE|SCHEMA|TABLE|COLUMN)|TRUNCATE([[:space:]]+TABLE)?|DELETE[[:space:]]+FROM' \
            $new_migrations || true)"
          if [ -z "$destructive" ]; then
            exit 0
          fi
          # The "explicitly reviewed deployment procedure" this gate requires:
          # a REVIEWED.md file committed in the SAME migration folder as the
          # destructive SQL, written by a human who has actually checked
          # prod's real data for the affected tables/columns (see
          # docs/destructive-migrations.md for the checklist). Its presence
          # is itself the audit trail — git blame on it shows who reviewed
          # it and when, and its content should say what was checked and
          # what was found. This does not skip prisma migrate deploy — the
          # normal deploy-time entrypoint still runs it; this only clears the
          # CI gate that would otherwise block the merge unconditionally.
          missing_review=0
          for file in $destructive; do
            dir="$(dirname "$file")"
            if [ ! -f "$dir/REVIEWED.md" ]; then
              echo "::error file=$file::Destructive migration is missing a reviewed sign-off. Add $dir/REVIEWED.md documenting who checked prod's real data for the affected tables/columns, what they found, and why it's safe to run. See docs/destructive-migrations.md."
              missing_review=1
            else
              echo "::notice file=$file::Destructive migration has a review sign-off at $dir/REVIEWED.md — allowed through."
            fi
          done
          if [ "$missing_review" -eq 1 ]; then
            exit 1
          fi

      - name: Apply committed migrations to a throwaway database
        run: npx prisma migrate deploy

      - name: Detect schema.prisma changes missing a migration
        shell: bash
        run: |
          set +e
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script \
            --exit-code > /tmp/schema-drift.sql
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::Failed to compute schema drift."
            cat /tmp/schema-drift.sql
            exit 1
          fi
          if [ "$code" -eq 2 ] && grep -Eiq '^CREATE TABLE|^CREATE( UNIQUE)? INDEX|ADD COLUMN|ADD CONSTRAINT' /tmp/schema-drift.sql; then
            echo "::error::prisma/schema.prisma declares columns/tables/indexes that no committed migration creates. This is exactly how production ends up crashing with 'column does not exist': schema.prisma was edited but 'prisma migrate dev' was never run to generate the migration. Run 'npx prisma migrate dev --name <change>' locally against a dev database, commit the generated migration folder, and push again. Missing additions:"
            grep -Ei '^CREATE TABLE|^CREATE( UNIQUE)? INDEX|ADD COLUMN|ADD CONSTRAINT|^--' /tmp/schema-drift.sql
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::prisma/schema.prisma and the committed migrations differ, but only by removals (e.g. a renamed/dropped model whose old table was never migrated away). This does not crash the app and is not blocked here, but should be cleaned up deliberately since dropping tables/columns needs the reviewed procedure this pipeline requires for destructive migrations:"
            cat /tmp/schema-drift.sql
          fi
          if [ "$code" -eq 0 ]; then
            echo "No drift: committed migrations fully account for prisma/schema.prisma."
          fi

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6

      - name: Validate deployment variables
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_CLOUD_RUN_SERVICE \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions variable: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - id: auth
        name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - id: deploy
        name: Build from the Dockerfile and deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          source: .
          # These are non-secret application capabilities required at startup.
          # Keeping them here prevents a code deploy from starting with stale
          # OAuth scope configuration already present on the Cloud Run service.
          # Commas inside one value must be escaped for deploy-cloudrun's parser.
          env_vars: |-
            YOUCAN_SCOPES=*
            LIGHTFUNNELS_SCOPES=orders\,funnels\,products\,customers
          env_vars_update_strategy: merge

      - name: Smoke-test the deployed revision
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          response="$(curl --fail --silent --show-error "${SERVICE_URL}/")"
          if [ "$response" != "Hello World!" ]; then
            echo "::error::Unexpected health response from ${SERVICE_URL}/"
            exit 1
          fi
