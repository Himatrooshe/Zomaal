    ForceLogPickupDto:
      type: object
      properties:
        PHONE:
          type: string
          description: Phone number ForceLog should call for the pickup.
          example: '0612345678'
          maxLength: 14
        CITY:
          type: string
          description: Pickup city ID/code or name as returned by `GET /shipping/forcelog/cities`.
          example: Casablanca
          maxLength: 50
        ADDRESS:
          type: string
          description: Complete address from which ForceLog should collect parcels.
          example: 25 Boulevard Zerktouni, 2nd floor
          maxLength: 100
        HOW:
          type: string
          description: Pickup instructions, contact name, or preferred time window.
          example: Ask for Nadia; available 14:00-17:00
          maxLength: 100
        STICKERS:
          type: boolean
          description: Whether the driver should bring printed parcel stickers to the pickup.
          example: true
          default: false
      required:
