          in: query
          description: Include refunded orders
          schema:
            default: false
            type: boolean
        - name: includeDispatched
          required: false
          in: query
          description: Include orders already dispatched
          schema:
            default: false
            type: boolean
        - name: includeInRevenue
          required: false
          in: query
