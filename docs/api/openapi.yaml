          enum:
            - primary
            - subuser
          example: subuser
          nullable: true
        connectedAt:
          type: string
          description: UTC time at which the current credential was connected or replaced. Null while disconnected.
          example: '2026-07-15T10:30:00.000Z'
          nullable: true
          format: date-time
        message:
          type: string
          description: Human-readable status summary.
          example: QuickLivraison account is connected
      required:
