        - CITY
        - ADDRESS
    ForceLogProductVariantDto:
      type: object
      properties:
        NAME:
          type: string
          description: Variant label (for example size, color, or both).
          example: Black / Medium
        QUANTITY:
          type: number
          description: Initial quantity sent to ForceLog stock.
          example: 20
          minimum: 0
        BARCODE:
          type: string
          description: Unique merchant barcode or SKU for this variant.
          example: TSHIRT-BLK-M
      required:
        - NAME
        - QUANTITY
    ForceLogProductDto:
      type: object
      properties:
        PRODUCT_NAME:
          type: string
          description: Display name of the product in ForceLog stock.
          example: Classic cotton T-shirt
        QUANTITY:
          type: number
          description: Initial quantity for a product without variants. Do not duplicate variant quantities here.
          example: 50
          minimum: 0
        BARCODE:
          type: string
          description: Unique merchant barcode or SKU for a product without variants.
          example: TSHIRT-CLASSIC
        CATEGORY_ID:
          type: number
          description: ForceLog stock category identifier.
          example: 12
          minimum: 1
        VARIANTS:
          description: Optional product variants. Each variant carries its own quantity and barcode.
          example:
            - NAME: Black / Medium
              QUANTITY: 20
              BARCODE: TSHIRT-BLK-M
            - NAME: Black / Large
              QUANTITY: 15
              BARCODE: TSHIRT-BLK-L
          type: array
          items:
            $ref: '#/components/schemas/ForceLogProductVariantDto'
      required:
