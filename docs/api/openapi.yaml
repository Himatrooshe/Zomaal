      tags:
        - Shipping - OzoneExpress
  /shipping/ozoneexpress/tracking:
    post:
      description: 'Requires `Authorization: Bearer <accessToken>` and `Content-Type: application/json`. Accepts either one provider tracking number or an array. The authenticated user must connect OzoneExpress first.'
      operationId: trackOzoneExpressParcels
      parameters: []
