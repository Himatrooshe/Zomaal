    CreateWarehouseProductDto:
      type: object
      properties:
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
          example: mobile-create-018f8d5a
          description: Client-generated retry key. Resending the identical request returns the existing product; reusing it for changed data returns 409.
        name:
          type: string
          example: Premium Cotton T-Shirt
        description:
          type: string
          example: Cotton T-shirt with size and colour options.
        categoryId:
          type: string
          format: uuid
          description: Active category returned by GET /warehouse/categories.
        status:
          type: string
          enum:
            - DRAFT
            - ACTIVE
            - ARCHIVED
          default: ACTIVE
          description: Map the design status toggle to ACTIVE when on and DRAFT when off. Archive later with the archive endpoint.
        mainImageUploadId:
          type: string
          format: uuid
          description: ID returned by POST /warehouse/media with purpose PRODUCT_MAIN. Required and single-use.
        galleryImageUploadIds:
          maxItems: 4
          description: Unique IDs returned by POST /warehouse/media with purpose PRODUCT_GALLERY.
          type: array
          items:
            type: string
        basePrice:
          type: number
          example: 50
          description: Price for a product without options. With options, each variant price is authoritative.
        costPrice:
          type: number
          example: 20
          description: Cost for a product without options and fallback cost for variants that omit costPrice.
        stockQuantity:
          type: number
          example: 10
          description: Opening stock for a product without options. With options, each variant stockQuantity is authoritative.
        lowStockAlertThreshold:
          type: number
          minimum: 0
          default: 5
          description: Default threshold and fallback for variants.
        sku:
          type: string
          description: SKU for a product without options. Supply SKU per variant when options are present.
          example: TSHIRT-DEFAULT
        barcode:
          type: string
          description: Barcode for a product without options. Generated when omitted. Supply barcode per variant when options are present.
          example: SUPPLIER-ITEM-001
        barcodeType:
          type: string
          enum:
            - INTERNAL_CODE_128
            - GTIN
            - EAN_13
            - UPC_A
            - OTHER
          description: Barcode type for the product-without-options barcode.
        options:
          maxItems: 3
          description: Omit for a simple product. When present, variants must contain every Cartesian combination exactly once.
          type: array
          items:
            $ref: '#/components/schemas/ProductOptionInputDto'
        variants:
          maxItems: 100
          description: Required when options are present and forbidden for a simple product.
          type: array
          items:
            $ref: '#/components/schemas/ProductVariantInputDto'
        gift:
          description: Omit when Enable Gift is off.
          allOf:
            - $ref: '#/components/schemas/ProductGiftInputDto'
        packaging:
          description: Omit or send an empty array when packaging tracking is off.
          type: array
          items:
            $ref: '#/components/schemas/ProductPackagingInputDto'
      required:
        - idempotencyKey
        - name
        - categoryId
        - mainImageUploadId
        - basePrice
        - costPrice
        - stockQuantity
