      tags:
        - Shipping - QuickLivraison
    post:
      description: 'Requires `Authorization: Bearer <accessToken>` and `Content-Type: application/json`. Validates a primary or subuser API key with QuickLivraison, then encrypts and stores it for the authenticated Zomaal user. Reconnecting replaces the previous credential. The API key is never returned.'
      operationId: connectQuickLivraisonAccount
      parameters: []
      requestBody:
        required: true
        description: QuickLivraison credential to validate and store for the authenticated user.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectQuickLivraisonDto'
            examples:
              subuser:
                summary: Subuser API key
                value:
                  apiKey: sub_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
              primary:
                summary: Primary account API key
                value:
                  apiKey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        '201':
          description: API key verified and QuickLivraison account connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickLivraisonConnectionStatusDto'
        '400':
          description: Missing, empty, or unexpected request fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '401':
          description: Missing or invalid Zomaal bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '502':
          description: QuickLivraison rejected the API key or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickLivraisonConnectionErrorDto'
        '503':
          description: QuickLivraison is unreachable or credential encryption is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Connect or replace the current user's QuickLivraison account
      tags:
        - Shipping - QuickLivraison
    delete:
      description: 'Requires `Authorization: Bearer <accessToken>`. Deletes the encrypted API key stored for the authenticated Zomaal user. This operation is idempotent: disconnecting an already disconnected account still succeeds.'
      operationId: disconnectQuickLivraisonAccount
      parameters: []
      responses:
        '200':
          description: QuickLivraison account disconnected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickLivraisonConnectionStatusDto'
        '401':
          description: Missing or invalid Zomaal bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Disconnect the current user's QuickLivraison account
      tags:
        - Shipping - QuickLivraison
