  /auth/shopify/callback:
    get:
      description: Public browser callback invoked by Shopify. It validates the timestamp, HMAC, permanent shop domain, and single-use OAuth state before exchanging the code for encrypted expiring offline tokens. Do not add a Zomaal bearer token.
      operationId: ShopifyOAuth_callback
      parameters:
        - name: timestamp
          required: true
          in: query
          schema:
            type: string
        - name: state
          required: true
          in: query
          schema:
            type: string
        - name: shop
          required: true
          in: query
          schema:
            type: string
        - name: host
          required: false
          in: query
          schema:
            type: string
        - name: hmac
          required: true
          in: query
          schema:
            type: string
        - name: code
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Connection status when no frontend success redirect is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnectionStatusDto'
        '302':
          description: Redirects to SHOPIFY_AUTH_SUCCESS_REDIRECT_URL with `shopify=connected`.
          headers:
            Location:
              description: Configured frontend integration settings page.
              schema:
                type: string
                example: http://localhost:5173/settings/integrations/shopify?shopify=connected
        '400':
          description: Required callback parameter is missing or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '401':
          description: Invalid HMAC, stale timestamp, invalid/reused state, invalid shop, or rejected authorization code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '409':
          description: The Shopify store is already connected to another Zomaal store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      summary: Complete Shopify authorization
      tags:
        - Shopify OAuth
  /webhooks/shopify:
    post:
      description: Public endpoint for order, refund, product, customer, uninstall, and mandatory privacy topics. The HMAC is verified against the exact raw request body before processing. Duplicate webhook IDs are acknowledged idempotently.
      operationId: ShopifyWebhook_handle
      parameters:
        - name: X-Shopify-Webhook-Id
          in: header
          required: true
          schema:
            type: string
            example: b54557e4-bdd9-4b37-8a5f-bf7d70bcd043
        - name: X-Shopify-API-Version
          in: header
          required: true
          schema:
            type: string
            example: 2026-07
        - name: X-Shopify-Shop-Domain
          in: header
          required: true
          schema:
            type: string
            example: atlas-market.myshopify.com
        - name: X-Shopify-Topic
          in: header
          required: true
          schema:
            type: string
            example: app/uninstalled
        - name: X-Shopify-Hmac-Sha256
          in: header
          description: Base64 HMAC-SHA256 signature generated by Shopify.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook verified and acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyWebhookReceiptDto'
        '400':
          description: Missing raw body or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
