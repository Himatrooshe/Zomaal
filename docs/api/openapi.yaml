      tags:
        - Shipping Integrations
  /shopify/auth/start:
    post:
      description: Requires a Zomaal access token and an existing Zomaal store. Returns a short-lived Shopify authorization URL. The frontend must navigate the browser to that URL; it must not call the URL server-to-server.
      operationId: Shopify_begin
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartShopifyAuthDto'
            examples:
              permanentDomain:
                summary: Permanent Shopify domain
                value:
                  shopDomain: atlas-market.myshopify.com
              handle:
                summary: Shop handle
                value:
                  shopDomain: atlas-market
      responses:
        '200':
          description: Single-use authorization URL created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyAuthorizationResponseDto'
        '400':
          description: Invalid or unexpected request field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '401':
          description: Missing or invalid Zomaal bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: The current user has not created a Zomaal store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '409':
          description: The Shopify shop is already connected to a different Zomaal store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Shopify integration or token encryption is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Start connecting a Shopify store
      tags:
        - Shopify
  /shopify/connection:
    get:
      operationId: Shopify_getStatus
      parameters: []
      responses:
        '200':
          description: Connection state. A missing connection is returned as `not_connected`, not as 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyConnectionStatusDto'
        '401':
          description: Missing or invalid Zomaal bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: The current user has not created a Zomaal store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Get the current store’s Shopify connection status
      tags:
        - Shopify
    delete:
      description: Deletes the locally stored access and refresh tokens. The merchant must also uninstall the app in Shopify Admin to revoke the Shopify installation.
      operationId: Shopify_disconnect
      parameters: []
      responses:
        '200':
          description: Local Shopify credentials removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyDisconnectResponseDto'
        '401':
          description: Missing or invalid Zomaal bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Zomaal store or Shopify connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Remove Shopify credentials from Zomaal
      tags:
        - Shopify
  /shopify/connection/verify:
    post:
      description: Refreshes the offline access token when necessary, calls the GraphQL Admin API, and returns non-secret shop identity fields.
      operationId: Shopify_verify
      parameters: []
      responses:
        '200':
          description: Shopify accepted the stored credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyShopVerificationDto'
        '401':
          description: Invalid Zomaal token or Shopify must be reauthorized after its refresh token expired/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '409':
          description: Shopify is not connected for the current store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '502':
          description: Shopify returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Shopify is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
