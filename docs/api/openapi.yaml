        '409':
          description: The current user has not connected an OzoneExpress account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '502':
          description: OzoneExpress returned a malformed or failed response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OzoneExpressConnectionErrorDto'
        '503':
          description: OzoneExpress is unreachable or the stored credentials cannot be decrypted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Track one or more OzoneExpress parcels
      tags:
        - Shipping - OzoneExpress
