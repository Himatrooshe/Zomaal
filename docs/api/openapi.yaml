  /auth/lightfunnels/callback:
    get:
      description: Public callback invoked by Lightfunnels. It consumes the single-use state, exchanges the code, verifies the account through GraphQL, and encrypts the permanent access token. Do not add a Zomaal bearer token.
      operationId: LightfunnelsOAuth_callback
      parameters:
        - name: error
          required: false
          in: query
          schema:
            type: string
        - name: state
          required: true
          in: query
          schema:
            type: string
        - name: code
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Connection status when no frontend success redirect is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightfunnelsConnectionStatusDto'
        '302':
          description: Redirects to LIGHTFUNNELS_AUTH_SUCCESS_REDIRECT_URL with lightfunnels=connected.
        '400':
          description: A required callback parameter is missing or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '401':
          description: Authorization was rejected or OAuth state/code is invalid, expired, or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: The token is missing a required Lightfunnels account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '409':
          description: The Lightfunnels account is already connected to another Zomaal store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '502':
          description: Lightfunnels returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Lightfunnels is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      summary: Complete Lightfunnels OAuth authorization
      tags:
        - Lightfunnels OAuth
