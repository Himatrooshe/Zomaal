  /shopify/store:
    get:
      description: Reads current store identity, domain, plan, currency, timezone, and address data directly from Shopify. Zomaal never returns the Shopify access token.
      operationId: ShopifyData_getStore
      parameters: []
      responses:
        '200':
          description: Current Shopify store overview.
          headers:
            Cache-Control:
              description: Store data can contain protected customer information and must not be stored by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyShopOverviewDto'
        '401':
          description: Missing/invalid Zomaal access token, or Shopify authorization has expired and the store must be reconnected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: The Shopify installation lacks a required scope or protected customer data approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: The current user has not created a Zomaal store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '409':
          description: The Zomaal store has no active Shopify connection. Complete Shopify OAuth first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '502':
          description: Shopify returned an empty, malformed, or schema-invalid GraphQL response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Shopify timed out, throttled the request after retries, or is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Get the connected Shopify store overview
      tags:
        - Shopify Data
  /shopify/products:
    get:
      description: Returns lightweight product summaries ordered by most recently updated. Requires Shopify `read_products` (or the corresponding write scope). Use `pageInfo.endCursor` as `after` to fetch the next page.
      operationId: ShopifyData_getProducts
      parameters:
        - name: first
          required: false
          in: query
          description: Page size. Defaults to 20 and is capped at 100 to control Shopify query cost and mobile payload size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          required: false
          in: query
          description: Opaque `pageInfo.endCursor` from the previous response. Omit for the first page; an empty value is treated as omitted.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: query
          required: false
          in: query
          description: Shopify search-syntax filter for this resource. The value is sent through a GraphQL variable; an empty value is treated as omitted.
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        '200':
          description: 'Cursor-paginated products. An empty store returns `data: []` with HTTP 200.'
          headers:
            Cache-Control:
              description: Store data can contain protected customer information and must not be stored by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopifyProductListResponseDto'
        '400':
          description: Invalid `first`, `after`, `query`, or an unexpected query parameter.
          content:
            application/json:
              schema:
