        - bearer: []
      summary: Resolve a physical scanner value to store inventory
      tags:
        - Warehouse Barcodes
  /warehouse/barcodes/{barcodeId}/label:
    get:
      description: Renders the stored barcode on demand; images are not stored in the database. PDF pages use the exact selected physical dimensions and work with normal printer drivers. SVG is useful for preview. Print at 100% / Actual Size with browser scaling disabled.
      operationId: Barcode_label
      parameters:
        - name: barcodeId
          required: true
          in: path
          schema:
            format: uuid
            type: string
        - name: format
          required: false
          in: query
          description: PDF is the printer-neutral production format. SVG is intended for browser preview and client-side printing.
          schema:
            default: pdf
            type: string
            enum:
              - pdf
              - svg
        - name: template
          required: false
          in: query
          description: Physical sticker size in millimetres.
          schema:
            default: THERMAL_60X40
            type: string
            enum:
              - THERMAL_50X30
              - THERMAL_60X40
              - THERMAL_100X50
      responses:
        '200':
          description: Binary PDF or UTF-8 SVG label, selected by the format query.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid query, unsupported stored value, or barcode too dense for reliable printing on the selected template.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
            image/svg+xml:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '401':
          description: Bearer token is missing, invalid, or expired.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
            image/svg+xml:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Barcode does not belong to the authenticated store.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
            image/svg+xml:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Render one printable barcode sticker
      tags:
        - Warehouse Barcodes
  /warehouse/barcodes/labels/batch:
    post:
      description: Creates one exact-size PDF page per sticker. Items retain request order and quantity repeats a label. Limited to 100 request rows, 100 copies per row, and 200 total pages to protect server memory and CPU.
      operationId: Barcode_batchLabels
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchBarcodeLabelsDto'
      responses:
        '200':
          description: Multi-page PDF ready for an operating-system printer driver.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid payload, total label limit exceeded, or a barcode is too dense for the template.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
            image/svg+xml:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '401':
          description: Bearer token is missing, invalid, or expired.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
            image/svg+xml:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: At least one barcode does not belong to the authenticated store.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
            image/svg+xml:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Render a multi-page barcode label PDF
      tags:
        - Warehouse Barcodes
  /warehouse/media:
    post:
      description: First step of Add Product media handling. Stores the object privately in Cloud Storage and creates a single-use temporary upload valid for 24 hours. Repeat the upload even when reusing the same physical image for another product.
      operationId: Media_upload
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - purpose
                - image
              properties:
                purpose:
                  type: string
                  enum:
                    - PRODUCT_MAIN
                    - PRODUCT_GALLERY
                    - VARIANT
                  description: 'Must match the later attachment field: mainImageUploadId, galleryImageUploadIds, or variant.imageUploadId.'
                image:
                  type: string
                  format: binary
                  description: Real JPEG, PNG, or WebP bytes, maximum 5 MiB. Renaming another file type is rejected.
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseMediaResponseDto'
        '400':
          description: Missing file, unsupported/corrupt JPEG/PNG/WebP bytes, invalid purpose, file over 5 MiB, or unexpected form field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '401':
          description: Bearer token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: The authenticated user has no store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: PRODUCT_IMAGE_BUCKET is missing or the runtime/local ADC identity cannot write to Cloud Storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Upload a temporary private warehouse image
      tags:
        - Warehouse Media
