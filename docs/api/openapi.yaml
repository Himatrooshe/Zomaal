                  name: Sara El Amrani
                  amount: 250
                  phone: '0612345678'
                  address: 123 Rue Al Massira, Maarif, Casablanca
                  code: ORDER-1001
                  note: Call the recipient before delivery
                  open: false
                  try: false
                  echange: false
                  prd_name: Running shoes
                  qte_prd: 1
              stock:
                summary: Stock-fulfilled parcel
                value:
                  district_id: 123
                  name: Sara El Amrani
                  amount: 250
                  phone: '0612345678'
                  address: 123 Rue Al Massira, Maarif, Casablanca
                  code: ORDER-1001
                  received_quantity:
                    '42': 2
              exchange:
                summary: Exchange parcel
                value:
                  district_id: 123
                  name: Sara El Amrani
                  amount: 0
