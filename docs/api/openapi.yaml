          type: string
          description: Customer API key copied from the ForceLog merchant account. Zomaal validates it, encrypts it at rest, and never returns it in a response.
          example: fl_live_7b1c2d3e4f5a6b7c
          format: password
          writeOnly: true
      required:
        - apiKey
    ForceLogParcelDto:
      type: object
      properties:
        ORDER_NUM:
          type: string
          description: Merchant order reference. It should be unique in the connected ForceLog account.
          example: ZM-2026-000123
          maxLength: 20
        RECEIVE:
          type: string
          description: Full name of the parcel recipient.
          example: Youssef El Amrani
          maxLength: 50
        PHONE:
          type: string
          description: Recipient phone number accepted by ForceLog, including the country code when applicable.
          example: '0612345678'
          maxLength: 14
        CITY:
          type: string
          description: Destination city ID/code or city name as returned by `GET /shipping/forcelog/cities`.
          example: Casablanca
          maxLength: 50
        ADDRESS:
          type: string
          description: Complete street address for delivery.
          example: 12 Rue Al Massira, Maarif
          maxLength: 100
        HOW:
          type: string
          description: Delivery directions or recipient availability details.
          example: Call before delivery; apartment 4
          maxLength: 100
        PRODUCT_NATURE:
          type: string
          description: Plain-language description of the parcel contents.
          example: Two cotton shirts
          maxLength: 100
        COD:
          type: number
          description: Cash-on-delivery amount in Moroccan dirhams. Omit or use `0` for a prepaid parcel.
          example: 349
          minimum: 0
        CAN_OPEN:
          type: boolean
          description: Whether the recipient may open and inspect the parcel before accepting it.
          example: false
          default: false
        STOCK:
          type: string
          description: Comma-separated ForceLog stock references. Add `:quantity` when the quantity is greater than one.
          example: TSHIRT-BLK-M:2,JEANS-BLU-32
        FRAGILE:
          type: boolean
          description: Whether ForceLog should handle the parcel as fragile.
          example: true
          default: false
        CARTON:
          type: string
          description: Carton/package reference understood by ForceLog.
          example: CARTON-M
      required:
        - ORDER_NUM
        - RECEIVE
        - PHONE
        - CITY
        - ADDRESS
    ForceLogRelaunchDto:
      type: object
      properties:
        CODE:
          type: string
          description: ForceLog parcel code to relaunch.
          example: FL123456789MA
          maxLength: 20
        RECEIVER:
          type: string
          description: Updated recipient full name.
          example: Salma Bennani
          maxLength: 50
        PHONE:
          type: string
          description: Updated recipient phone number.
          example: '0623456789'
          maxLength: 14
        ADDRESS:
          type: string
          description: Updated delivery street address.
          example: 8 Avenue Mohammed V, Agdal
          maxLength: 100
        COD:
          type: number
          description: Updated cash-on-delivery amount in Moroccan dirhams.
          example: 299
          minimum: 0
        COMMENT:
          type: string
          description: Reason or delivery note attached to the relaunch request.
          example: Customer confirmed the new address by phone
          maxLength: 100
      required:
        - CODE
        - RECEIVER
        - PHONE
        - ADDRESS
        - COD
    ForceLogRelaunchZoneDto:
      type: object
      properties:
        CODE:
          type: string
          description: ForceLog parcel code to relaunch.
          example: FL123456789MA
          maxLength: 20
        RECEIVER:
          type: string
          description: Updated recipient full name.
          example: Salma Bennani
          maxLength: 50
        PHONE:
          type: string
          description: Updated recipient phone number.
