  /ecommerce/connections/{connectionId}/sync:
    post:
      description: Fetches at most five Shopify, YouCan, or Lightfunnels pages and upserts normalized, non-PII order financials. If `hasMore` is true, call this operation again; synchronization resumes from the saved provider cursor.
      operationId: Ecommerce_syncConnection
      parameters:
        - name: connectionId
          required: true
          in: path
          description: ID returned by `GET /ecommerce/connections`.
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: Synchronization chunk completed.
          headers:
            Cache-Control:
              description: Revenue and connection data is private to the authenticated store and must not be cached.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcommerceSyncResponseDto'
        '400':
          description: '`connectionId` is not a valid UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '401':
          description: Missing or invalid Zomaal access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: The provider token is missing a required order-read permission. Reconnect with the documented scopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: The connection does not exist or does not belong to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '409':
          description: The provider account must be reconnected before syncing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '502':
          description: Shopify, YouCan, or Lightfunnels returned malformed order, monetary, or pagination data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: The selected provider is throttled or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Synchronize order revenue from one account
      tags:
        - E-commerce Revenue
