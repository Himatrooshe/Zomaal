      operationId: ShippingIntegrations_list
      parameters: []
      responses:
        '200':
          description: Complete frontend shipping catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingIntegrationsResponseDto'
        '401':
          description: Missing, invalid, expired, or non-access Zomaal bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Load the complete shipping integration catalog
      tags:
        - Shipping Integrations
  /shipping/integrations/{companyCode}/connection:
    post:
      description: Submit only the credential fields declared in authFields for the selected company. Values marked inputType=secure_text must be masked by the frontend and excluded from logs and analytics. Credentials are validated by the provider before encrypted storage.
      operationId: ShippingIntegrations_connect
      parameters:
        - name: companyCode
          required: true
          in: path
          schema:
            enum:
              - sendit
              - quicklivraison
              - forcelog
              - ozoneexpress
            type: string
      requestBody:
        required: true
        description: Provider-specific credentials. The companyCode path dropdown and request example dropdown are independent in Swagger UI; select the matching named request example below.
        content:
          application/json:
            schema:
              oneOf:
                - title: Sendit credentials
                  type: object
                  required:
                    - credentials
                  additionalProperties: false
                  properties:
                    credentials:
                      type: object
                      required:
                        - public_key
                        - secret_key
                      additionalProperties: false
                      properties:
                        public_key:
                          type: string
                          example: sendit-public-key
                        secret_key:
                          type: string
                          writeOnly: true
                          example: sendit-secret-key
                - title: QuickLivraison credentials
                  type: object
                  required:
                    - credentials
                  additionalProperties: false
                  properties:
                    credentials:
                      type: object
                      required:
                        - apiKey
                      additionalProperties: false
                      properties:
                        apiKey:
                          type: string
                          writeOnly: true
                          example: sub_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                - title: ForceLog credentials
                  type: object
                  required:
                    - credentials
                  additionalProperties: false
                  properties:
                    credentials:
                      type: object
                      required:
                        - apiKey
                      additionalProperties: false
                      properties:
                        apiKey:
                          type: string
                          writeOnly: true
                          example: your-forcelog-api-key
                - title: OzoneExpress credentials
                  type: object
                  required:
                    - credentials
                  additionalProperties: false
                  properties:
                    credentials:
                      type: object
                      required:
                        - customerId
                        - apiKey
                      additionalProperties: false
                      properties:
                        customerId:
                          type: string
                          example: '12345'
                        apiKey:
                          type: string
                          writeOnly: true
                          example: your-ozoneexpress-api-key
            examples:
              sendit:
                summary: Sendit credentials
                value:
                  credentials:
                    public_key: sendit-public-key
                    secret_key: sendit-secret-key
              quicklivraison:
                summary: QuickLivraison credentials
                value:
                  credentials:
                    apiKey: sub_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
              forcelog:
                summary: ForceLog credentials
                value:
                  credentials:
                    apiKey: your-forcelog-api-key
              ozoneexpress:
                summary: OzoneExpress credentials
                value:
                  credentials:
                    customerId: '12345'
                    apiKey: your-ozoneexpress-api-key
      responses:
        '201':
          description: Provider credentials verified and connection saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingIntegrationConnectionResponseDto'
        '400':
          description: Missing, empty, unexpected, or provider-inappropriate credential field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '401':
          description: Missing, invalid, expired, or non-access Zomaal bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Unknown or unsupported shipping company code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '502':
          description: The provider returned an invalid or failed response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: The provider is unreachable or encryption is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: Connect or replace a shipping company account
      tags:
        - Shipping Integrations
    delete:
      description: Deletes the authenticated user’s encrypted credentials for the selected company. This operation is idempotent.
      operationId: ShippingIntegrations_disconnect
      parameters:
        - name: companyCode
          required: true
          in: path
          schema:
            enum:
              - sendit
              - quicklivraison
              - forcelog
              - ozoneexpress
            type: string
      responses:
        '200':
          description: Shipping company account disconnected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingIntegrationConnectionResponseDto'
        '401':
