    post:
      description: 'Requires `Authorization: Bearer <accessToken>`. In Swagger UI, click **Authorize** and paste the Zomaal access token only. Requires `Content-Type: application/json`. Validates the key with ForceLog, then encrypts and stores it. Reconnecting replaces the previous key; the plaintext key is never returned.'
      operationId: connectForceLogAccount
      parameters: []
      requestBody:
        required: true
