          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/InventoryPackagingReferenceDto'
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseBarcodeDto'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/InventoryBalanceResponseDto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - variant
        - packagingMaterial
        - barcodes
        - balances
        - createdAt
        - updatedAt
    InventoryMovementLocationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Main Warehouse
      required:
        - id
        - name
    InventoryMovementResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - OPENING_BALANCE
            - MANUAL_ADJUSTMENT
            - ORDER_RESERVED
            - ORDER_RELEASED
            - ORDER_SHIPPED
            - RETURN_GOOD
            - RETURN_DAMAGED
            - PACKAGING_RECEIVED
            - PACKAGING_CONSUMED
          example: MANUAL_ADJUSTMENT
        bucket:
          type: string
          enum:
            - ON_HAND
            - RESERVED
            - DAMAGED
            - INCOMING
          example: ON_HAND
        quantityDelta:
          type: number
          example: 10
        resultingQuantity:
          type: number
          example: 60
        reason:
          type: object
          nullable: true
          example: Received stock from supplier
        referenceType:
          type: object
          nullable: true
          example: SUPPLIER_DELIVERY
        referenceId:
          type: object
          nullable: true
          example: DELIVERY-1001
        idempotencyKey:
          type: object
          nullable: true
          example: inventory-adjustment-001
        inventoryItemId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/InventoryMovementLocationDto'
      required:
        - id
        - type
        - bucket
        - quantityDelta
        - resultingQuantity
        - reason
        - referenceType
        - referenceId
        - idempotencyKey
        - inventoryItemId
        - locationId
        - createdAt
    AdjustInventoryDto:
      type: object
      properties:
        bucket:
          type: string
          enum:
            - ON_HAND
            - RESERVED
            - DAMAGED
            - INCOMING
          description: 'Quantity bucket to change: ON_HAND physical stock, RESERVED allocated stock, DAMAGED unusable stock, or INCOMING expected stock.'
        quantityDelta:
          type: number
          description: Non-zero integer. Positive adds to the selected bucket; negative removes from it.
          example: 10
        reason:
          type: string
          minLength: 3
          maxLength: 500
          example: Received ten units from supplier
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
          example: inventory-adjustment-001
          description: Retry key unique for this inventory item. Reusing it returns the existing movement without changing stock twice.
        referenceType:
          type: string
          maxLength: 100
          example: SUPPLIER_DELIVERY
        referenceId:
          type: string
          maxLength: 255
          example: DELIVERY-1001
      required:
        - bucket
        - quantityDelta
        - reason
        - idempotencyKey
    OwnedPackagingMaterialResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        zomaalShopVariantId:
          type: string
          description: Variant identifier from the Zomaal packaging shop catalog.
          example: shop-box-large-brown
        name:
          type: string
          example: Large corrugated box
        sku:
          type: object
          nullable: true
          example: BOX-LARGE-BROWN
        imageUrl:
          type: object
          nullable: true
          description: Authenticated relative image URL. Null when the shop catalog item has no image.
          example: /warehouse/packaging/2d5e2688-0818-429a-bb03-8351130c60ea/image
        inventoryItemId:
          type: object
          nullable: true
          format: uuid
        available:
          type: number
          description: On-hand minus reserved and damaged quantities across locations.
          example: 20
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - zomaalShopVariantId
        - name
        - sku
        - imageUrl
        - inventoryItemId
        - available
        - createdAt
        - updatedAt
