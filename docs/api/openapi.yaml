        '403':
          description: The Shopify installation lacks a required scope or protected customer data approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: The current user has not created a Zomaal store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '409':
          description: The Zomaal store has no active Shopify connection. Complete Shopify OAuth first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '502':
          description: Shopify returned an empty, malformed, or schema-invalid GraphQL response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Shopify timed out, throttled the request after retries, or is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearer: []
      summary: List products from the connected Shopify store
      tags:
        - Shopify Data
  /shopify/products/{productId}:
    get:
      description: Returns the product description, SEO, media, options, and cursor-paginated variants directly from Shopify. Use the numeric suffix of the GraphQL product ID returned by the product list.
      operationId: ShopifyData_getProduct
