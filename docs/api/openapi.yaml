            minimum: 1
            maximum: 100
            default: 50
            example: 50
            type: number
        - name: variantsAfter
          required: false
          in: query
          description: Opaque variant cursor returned in `variants.pageInfo.endCursor`.
          schema:
            maxLength: 2048
            type: string
        - name: mediaFirst
          required: false
          in: query
          description: Maximum product media items to return. Use `media.pageInfo.endCursor` with `mediaAfter` for the next page.
          schema:
            minimum: 1
            maximum: 50
            default: 20
            example: 20
            type: number
        - name: mediaAfter
