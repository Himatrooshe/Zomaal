  /warehouse/barcodes/resolve:
    get:
      description: A USB/Bluetooth scanner normally types the decoded value into the app. Send that exact value here to retrieve the authenticated store product variant or packaging material and aggregated inventory. Values from another merchant store intentionally return 404.
      operationId: Barcode_resolve
      parameters:
        - name: value
          required: true
          in: query
          description: Exact text decoded by the scanner. Surrounding whitespace is removed and Zomaal internal values are normalized to uppercase.
          schema:
            minLength: 3
            maxLength: 100
            example: ZML-A1B2C3D4E5F6
            type: string
      responses:
        '200':
          description: ''
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ResolvedBarcodeResponseDto'
            image/svg+xml:
              schema:
                $ref: '#/components/schemas/ResolvedBarcodeResponseDto'
        '400':
          description: The scanned value contains unsupported characters or length.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
            image/svg+xml:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '401':
          description: Bearer token is missing, invalid, or expired.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
            image/svg+xml:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: The user has no store, or this store has no inventory barcode with that value.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
            image/svg+xml:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
